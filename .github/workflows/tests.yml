name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Throwaway key for CI only; real keys live in Railway variables.
      DJANGO_SECRET_KEY: ci-only-not-secret-${{ github.run_id }}-${{ github.run_attempt }}-padding-to-fifty-chars
      DJANGO_DEBUG: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
